services:
  backend:
    build: ./backend
    environment:
      - PYVENTURER_DB_PATH=/data/pyventurer.db
      - PYVENTURER_SECRET_KEY=${PYVENTURER_SECRET_KEY:-change-me-in-production-use-32-chars}
    volumes:
      - db_data:/data
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
